lab:
  message:
    local:
      enabled: false
    adapter:
      enabled: true
      consumers:
        lab.order-events:
          message-lab-order-primary:
            consumeMode: CONCURRENTLY
          message-lab-order-audit: {}

# Official Apache RocketMQ Spring (sole native config source)
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: ${spring.application.name}-producer
